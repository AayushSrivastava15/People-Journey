# Render Blueprint configuration for People Journey HR Portal
# Documentation: https://render.com/docs/blueprint-spec

services:
  # Frontend Single-Page Application (Static Site)
  - type: web
    name: people-journey-hr
    runtime: static
    buildCommand: npm run build:frontend
    staticPublishPath: ./frontend/dist
    routes:
      # SPA Catch-all Rewrite: Redirects all deep links and page refreshes (e.g. /dashboard, /dashboard/overview)
      # to /index.html so client-side routing (Wouter) resolves them without 404 errors.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.googleusercontent.com https://lh3.googleusercontent.com; connect-src 'self' https://people-journey.onrender.com https://people-journey-hr.onrender.com https://*.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.firebaseio.com http://localhost:* ws://localhost:*; frame-src 'self' https://peoplejourney-4d586.firebaseapp.com https://accounts.google.com https://docs.google.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com;"

